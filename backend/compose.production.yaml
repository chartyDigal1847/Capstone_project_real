# Production Compose for the Firebase-backed target architecture.
# No MySQL container — Firestore and Cloud Storage are managed services.
# Redis provides cache and queue backends. Laravel verifies Firebase ID
# tokens and accesses Firestore via IAM/ADC (no service-account key in image).
services:
    app:
        image: ${LOCALSPOT_IMAGE:?set LOCALSPOT_IMAGE to a versioned production tag}
        restart: unless-stopped
        ports:
            - '8080:8080'
        environment:
            APP_ENV: production
            APP_DEBUG: 'false'
            APP_KEY: ${APP_KEY}
            APP_URL: ${APP_URL}
            # Firebase — Firestore + Storage accessed via ADC/IAM, no embedded keys
            FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
            FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET}
            # Queue/cache via Redis, not MySQL
            QUEUE_CONNECTION: redis
            CACHE_STORE: redis
            SESSION_DRIVER: redis
        depends_on:
            redis:
                condition: service_healthy
        networks:
            - internal
        healthcheck:
            test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/up']
            interval: 30s
            timeout: 5s
            retries: 3
    redis:
        image: redis:7-alpine
        restart: unless-stopped
        command: ['redis-server', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
        networks:
            - internal
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 15s
            timeout: 5s
            retries: 5
        # Intentionally not published to the host.

networks:
    internal:
        driver: bridge
