# Local development only (Laravel Sail).
#
# Target architecture: Firestore and Cloud Storage are managed Firebase
# services (not Docker containers). MySQL is retained here ONLY for Laravel
# framework tables (cache/sessions/jobs) during development. In production,
# these move to Redis and MySQL is removed entirely (see compose.production.yaml).
#
# For Firebase Emulator Suite integration, start emulators separately:
#   firebase emulators:start --only auth,firestore,storage
# and set FIRESTORE_EMULATOR_HOST / FIREBASE_AUTH_EMULATOR_HOST in .env.
services:
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.2
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: sail-8.2/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-8000}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            # Firebase Emulator Suite — point to host when emulators are running
            FIREBASE_PROJECT_ID: '${FIREBASE_PROJECT_ID:-capstone-project-561a2}'
            FIRESTORE_EMULATOR_HOST: '${FIRESTORE_EMULATOR_HOST:-}'
            FIREBASE_AUTH_EMULATOR_HOST: '${FIREBASE_AUTH_EMULATOR_HOST:-}'
            FIREBASE_STORAGE_EMULATOR_HOST: '${FIREBASE_STORAGE_EMULATOR_HOST:-}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'curl -f http://localhost/up || exit 1']
            retries: 5
            timeout: 5s
    mysql:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-password}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE:-localspot}'
            MYSQL_USER: '${DB_USERNAME:-sail}'
            MYSQL_PASSWORD: '${DB_PASSWORD:-password}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'sail-mysql:/var/lib/mysql'
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-p${DB_PASSWORD:-password}']
            retries: 5
            timeout: 5s
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
