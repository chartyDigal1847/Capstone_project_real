name: localspot
description: Philippine local store and product locator.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.7.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  # Firebase – primary database and authentication
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5
  # Utilities
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  maplibre_gl: ^0.27.1
  geolocator: ^13.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
