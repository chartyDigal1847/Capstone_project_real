name: localspot
description: Locentra Philippine local store and product locator.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.7.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  # Firebase – primary database and authentication
  firebase_core: ^3.13.0
  firebase_analytics: ^11.6.0
  firebase_crashlytics: ^4.3.10
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  # Utilities
  url_launcher: ^6.3.1
  http: ^1.2.2
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  mapbox_maps_flutter: ^3.34.1
  cloud_functions: ^5.6.2
  firebase_app_check: ^0.3.2+10
  firebase_ai: ^2.3.0
  panorama_privacy_prototype:
    path: prototypes/panorama_privacy_prototype
  panorama_viewer: ^3.0.0
  crypto: ^3.0.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  default-flavor: local
  uses-material-design: true
  assets:
    - assets/brand/locentra-logo.png
    - assets/data/ph_psgc_locations.json
